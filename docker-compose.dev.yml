# Hot-reload development: docker compose -f docker-compose.dev.yml up
name: eventlink-dev

services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules: {}
