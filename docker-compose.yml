name: eventlink

services:
  web:
    build:
      context: .
      target: web
    image: eventlink-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [edge, backend]
    depends_on:
      redis:
        condition: service_healthy

  # Not started by default. Add your backend here, or run it with:
  #   docker compose --profile api up
  # nginx already proxies /api/ to http://api:3000.
  api:
    profiles: [api]
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv
    command: ["node", "server.js"]
    environment:
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    networks: [backend]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

networks:
  # public side: only nginx is published to the host
  edge: {}
  # private side: redis and the api. internal means no route to the outside world
  backend:
    internal: true

volumes:
  redis-data: {}
