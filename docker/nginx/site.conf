# Docker's embedded DNS. Re-resolves "api" at request time so nginx still starts
# when the api service is not running yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Liveness probe for Docker / load balancers
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Backend API. Proxied to the "api" service on the private backend network.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }

  # Hashed build assets: cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Photos and other static files
  location /images/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Single page app: every other route falls back to index.html so React Router
  # handles /customer, /provider/bookings, /admin/analytics and so on.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
